name: Feature request
description: A chart type, option or capability the packages do not have yet.
labels: [enhancement]
body:
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - "@borrowdale/core"
        - "@borrowdale/fills"
        - "@borrowdale/text"
        - "@borrowdale/charts"
        - A new package
        - Not sure
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: What you are trying to do
      description: The drawing or chart you want to make, and what stops you today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
      description: An API sketch, an example spec, or a picture of the result.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues.
          required: true
